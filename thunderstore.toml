[config]
schemaVersion = "0.0.1"


[package]
namespace = "Adicon"
name = "SelectFirstBoon"
versionNumber = "4.32.0"
description = "Choose which god offers the first boon of a run, or hold Hermes and Selene back until you have one."
websiteUrl = "https://github.com/Ad1con/SelectFirstBoon"
containsNsfwContent = false

# Must match src/manifest.json. The release workflow rewrites versionNumber here
# from the tag you type, and does NOT touch manifest.json -- a test asserts the
# two agree, so drift fails the suite instead of shipping.
#
# SJSON is required here and is not in RealHecate's list: this mod registers art
# for the added gods by patching Items_General_VFX.sjson and Gameplay.sjson at
# load. ReLoad is absent for the opposite reason -- this mod has no on_reload
# path, so depending on it would declare something it never calls.
[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.78"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-ModUtil = "4.0.1"
SGG_Modding-SJSON = "1.0.1"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

# src/ is the whole mod. Tests, docs, guard.sh and .git are outside it and so
# cannot end up in the package by accident.
[[build.copy]]
source = "./src"
target = "./plugins"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", ]
